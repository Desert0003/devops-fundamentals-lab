<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خدمة الإبلاغ عن حادث بسيط</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #eef3f5; color: #0e1a24; margin: 0; }
    header { background: #0e1a24; color: #fff; padding: 18px 24px; }
    header small { color: #9fb3c0; }
    main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 18px; }
    label { display: block; margin: 10px 0 4px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #c9d5dc; border-radius: 6px; }
    button { margin-top: 14px; background: #0fa3a3; color: #fff; border: 0; padding: 10px 22px; border-radius: 6px; cursor: pointer; }
    #msg { margin-top: 10px; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <header>
    <h2>خدمة الإبلاغ عن حادث بسيط</h2>
    <small>الإصدار {{ version }}</small>
  </header>
  <main>
    <div class="card">
      <form id="f">
        <label for="location">الموقع</label>
        <input id="location" required>
        <label for="type">نوع الحادث</label>
        <select id="type">
          <option value="collision">تصادم بسيط</option>
          <option value="breakdown">تعطل مركبة</option>
          <option value="obstacle">عائق على الطريق</option>
          <option value="other">أخرى</option>
        </select>
        <label for="description">الوصف</label>
        <textarea id="description" rows="3"></textarea>
        <button type="submit">إرسال البلاغ</button>
        <div id="msg"></div>
      </form>
    </div>
    <div class="card">
      <h3>آخر البلاغات</h3>
      <ul>
        {% for r in reports %}<li>#{{ r.id }} · {{ r.location }} · {{ r.type }}</li>{% else %}<li>لا توجد بلاغات بعد</li>{% endfor %}
      </ul>
    </div>
  </main>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const $ = (id) => document.getElementById(id);
      const body = { location: $('location').value, type: $('type').value, description: $('description').value };
      const r = await fetch('/api/reports', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json();
      $('msg').textContent = r.ok ? 'تم تسجيل البلاغ رقم ' + d.id : d.errors.join(' | ');
      if (r.ok) setTimeout(() => window.location.reload(), 800);
    });
  </script>
</body>
</html>
